<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Esha Ashfar — Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f3ec;
        --ink: #1f2328;
        --muted: #6b6f76;
        --line: #e2ddd2;
        --screen: #1e2430;
        --screen-ink: #e8eaed;
        --coral: #ff7a59;
        --teal: #2bb3a3;
        --yellow: #ffc845;
        --blue: #3d8bfd;
        --green: #7cc36b;
        --plain: #fdfbf7;
        --case: #d9d3c6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        background-image: radial-gradient(#d8d2c4 1px, transparent 1px);
        background-size: 22px 22px;
        color: var(--ink);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        line-height: 1.6;
        overflow-x: hidden;
        min-height: 100vh;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: clamp(28px, 6vw, 64px) clamp(14px, 4vw, 32px) 32px;
        position: relative;
        z-index: 1;
      }

      / floating tokens / .tokens {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .tokens span {
        position: absolute;
        font-family: "JetBrains Mono", monospace;
        font-weight: 600;
        color: #cfc7b6;
        font-size: clamp(14px, 2vw, 22px);
        animation: float 14s ease-in-out infinite;
      }
      .tokens span:nth-child(1) {
        top: 8%;
        left: 6%;
      }
      .tokens span:nth-child(2) {
        top: 14%;
        right: 8%;
        color: #f4b3a1;
        animation-delay: -2s;
      }
      .tokens span:nth-child(3) {
        top: 40%;
        left: 3%;
        animation-delay: -4s;
      }
      .tokens span:nth-child(4) {
        top: 62%;
        right: 4%;
        color: #9fd9d1;
        animation-delay: -6s;
      }
      .tokens span:nth-child(5) {
        top: 82%;
        left: 10%;
        animation-delay: -1s;
      }
      .tokens span:nth-child(6) {
        top: 90%;
        right: 16%;
        animation-delay: -8s;
      }
      .tokens span:nth-child(7) {
        top: 30%;
        right: 20%;
        animation-delay: -3s;
      }
      .tokens span:nth-child(8) {
        top: 72%;
        left: 30%;
        color: #ffe08f;
        animation-delay: -5s;
      }
      .tokens span:nth-child(9) {
        top: 4%;
        left: 46%;
        animation-delay: -7s;
      }
      .tokens span:nth-child(10) {
        top: 50%;
        right: 30%;
        color: #a9c8fb;
        animation-delay: -9s;
      }
      @keyframes float {
        50% {
          transform: translateY(-18px) rotate(4deg);
        }
      }
      .intro {
        text-align: center;
        margin-bottom: clamp(20px, 4vw, 36px);
      }
      .path {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .branch {
        color: var(--teal);
      }
      h1 {
        font-family: "JetBrains Mono", monospace;
        font-weight: 800;
        font-size: clamp(2.2rem, 7vw, 4.2rem);
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin: 0.2em 0;
      }
      .role {
        color: var(--muted);
        font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      }
      .dot {
        color: var(--coral);
        margin: 0 0.3em;
      }
      .links {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }
      .links a {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        padding: 8px 14px;
        border: 1.5px solid var(--ink);
        border-radius: 8px;
        background: var(--plain);
        box-shadow: 3px 3px 0 var(--ink);
        transition: 0.15s;
      }
      .links a:hover {
        transform: translate(-1px, -1px);
        box-shadow: 5px 5px 0 var(--ink);
      }
      .links a:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--ink);
      }

      / monitor / .stage {
        perspective: 1400px;
      }
      .monitor {
        background: var(--screen);
        border-radius: 14px;
        overflow: hidden;
        border: 10px solid #2d3340;
        box-shadow:
          0 30px 60px -25px rgba(31, 35, 40, 0.45),
          0 0 0 1px #0002;
        max-width: 820px;
        margin: 0 auto;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 14px;
        background: #262c38;
        border-bottom: 1px solid #353c4a;
      }
      .bar i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        display: block;
      }
      .bar .r {
        background: #ff5f57;
      }
      .bar .y {
        background: #febc2e;
      }
      .bar .g {
        background: #28c840;
      }
      .file {
        margin-left: 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.78rem;
        color: #9aa3b2;
      }
      .screen {
        padding: clamp(16px, 3vw, 28px);
        min-height: 300px;
        max-height: min(58vh, 520px);
        overflow: auto;
        color: var(--screen-ink);
        font-size: 0.95rem;
      }
      .screen::-webkit-scrollbar {
        width: 8px;
      }
      .screen::-webkit-scrollbar-thumb {
        background: #3a4252;
        border-radius: 8px;
      }
      .cmd {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.82rem;
        color: #9aa3b2;
        margin-bottom: 16px;
        word-break: break-word;
      }
      .prompt {
        color: var(--green);
      }
      .caret {
        display: inline-block;
        width: 0.55em;
        height: 1em;
        background: var(--yellow);
        vertical-align: -2px;
        margin-left: 3px;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .panel {
        animation: in 0.35s ease;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      .panel h2 {
        font-family: "JetBrains Mono", monospace;
        font-size: 1.05rem;
        margin-bottom: 12px;
      }
      .panel p {
        color: #c9ced6;
        margin-bottom: 10px;
      }
      .c-key {
        color: #ff9e80;
      }
      .c-str {
        color: #9be29b;
      }
      .c-kw {
        color: #7fb6ff;
      }
      .c-com {
        color: #7d8696;
        font-style: italic;
      }
      .c-num {
        color: var(--yellow);
      }
      pre.code {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 12px;
      }
      .card {
        border: 1px solid #353c4a;
        border-radius: 10px;
        padding: 14px;
        background: #232a36;
        transition: 0.2s;
      }
      .card:hover {
        border-color: var(--teal);
        transform: translateY(-2px);
      }
      .card h3 {
        font-size: 1rem;
        margin-bottom: 2px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .card h3 a:hover {
        color: var(--yellow);
      }
      .tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        color: var(--teal);
        white-space: nowrap;
      }
      .card p {
        font-size: 0.88rem;
        margin: 6px 0;
      }
      .stack {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        color: #9aa3b2;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0 14px;
      }
      .chip {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.78rem;
        padding: 3px 9px;
        border-radius: 6px;
        background: #2c3442;
        border: 1px solid #3a4252;
      }
      .label {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: #7d8696;
      }
      .timeline {
        border-left: 2px solid #3a4252;
        padding-left: 16px;
        display: grid;
        gap: 16px;
      }
      .timeline .when {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: var(--yellow);
      }
      .timeline h3 {
        font-size: 1rem;
      }
      .timeline .org {
        color: var(--teal);
        font-size: 0.88rem;
      }
      ul.list {
        list-style: none;
        display: grid;
        gap: 8px;
      }
      ul.list li::before {
        content: "> ";
        color: var(--coral);
        font-family: "JetBrains Mono", monospace;
      }
      .panel a.u {
        color: var(--yellow);
        border-bottom: 1px dashed;
      }

      / 3D keyboard / .kb-scene {
        position: relative;
        max-width: 780px;
        margin: clamp(-6px, -1vw, 0px) auto 0;
        padding-top: 30px;
        transform-style: preserve-3d;
      }
      .keyboard {
        --rx: 42deg;
        --ry: 0deg;
        transform: rotateX(var(--rx)) rotateY(var(--ry));
        transform-style: preserve-3d;
        transition: transform 0.25s ease-out;
        background: linear-gradient(180deg, #e7e1d4, var(--case));
        border-radius: 18px;
        padding: clamp(10px, 2vw, 18px);
        box-shadow:
          0 14px 0 #bdb5a5,
          0 40px 50px -20px rgba(31, 35, 40, 0.4);
        display: grid;
        gap: clamp(7px, 1.4vw, 12px);
      }
      .kb-shadow {
        height: 24px;
        margin: -6px auto 0;
        width: 80%;
        background: radial-gradient(
          ellipse at center,
          rgba(31, 35, 40, 0.25),
          transparent 70%
        );
      }
      .row {
        display: flex;
        gap: clamp(7px, 1.4vw, 12px);
      }
      .key {
        --c: var(--plain);
        --edge: #cfc8b8;
        flex: 1;
        min-width: 0;
        cursor: pointer;
        border: 0;
        font: inherit;
        color: var(--ink);
        text-align: left;
        height: clamp(58px, 10vw, 84px);
        padding: clamp(6px, 1.2vw, 10px) clamp(8px, 1.4vw, 12px);
        border-radius: 10px;
        background: var(--c);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow:
          0 7px 0 var(--edge),
          0 9px 10px rgba(31, 35, 40, 0.25),
          inset 0 -3px 0 rgba(0, 0, 0, 0.08),
          inset 0 2px 0 rgba(255, 255, 255, 0.5);
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease,
          filter 0.15s;
      }
      .key:hover {
        filter: brightness(1.05);
      }
      .key:active,
      .key.down {
        transform: translateY(6px);
        box-shadow:
          0 1px 0 var(--edge),
          0 2px 4px rgba(31, 35, 40, 0.25),
          inset 0 -2px 0 rgba(0, 0, 0, 0.08);
      }
      .key.on {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      .key b {
        font-family: "JetBrains Mono", monospace;
        font-size: clamp(0.95rem, 2.2vw, 1.25rem);
        font-weight: 800;
      }
      .key small {
        font-family: "JetBrains Mono", monospace;
        font-size: clamp(0.6rem, 1.4vw, 0.75rem);
        opacity: 0.8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .wide {
        flex: 1.7;
      }
      .space {
        flex: 4;
      }
      .k-coral {
        --c: var(--coral);
        --edge: #d4583b;
      }
      .k-teal {
        --c: var(--teal);
        --edge: #1d877b;
        color: #fff;
      }
      .k-yellow {
        --c: var(--yellow);
        --edge: #d6a42c;
      }
      .k-blue {
        --c: var(--blue);
        --edge: #2a69c7;
        color: #fff;
      }
      .k-green {
        --c: var(--green);
        --edge: #5a9c4b;
      }
      .k-ink {
        --c: var(--ink);
        --edge: #000;
        color: #fff;
      }
      .k-plain {
        --c: var(--plain);
        --edge: #cfc8b8;
      }
      .hint {
        text-align: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 8px;
      }
      footer {
        text-align: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 40px;
      }

      @media (max-width: 640px) {
        .keyboard {
          --rx: 28deg;
        }
        .row {
          flex-wrap: wrap;
        }
        .key,
        .wide {
          flex: 1 1 calc(50% - 8px);
        }
        .space {
          flex: 1 1 100%;
        }
        .monitor {
          border-width: 7px;
        }
        .screen {
          min-height: 260px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      /* ---- responsive + click fixes ---- */
      .kb-scene,
      .keyboard,
      .key {
        position: relative;
        z-index: 2;
      }
      .key {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      @media (max-width: 900px) {
        .keyboard {
          --rx: 30deg;
        }
      }
      @media (max-width: 640px) {
        .keyboard {
          --rx: 0deg !important;
          --ry: 0deg !important;
          transform: none;
        }
        .key {
          height: 60px;
        }
        .screen {
          max-height: none;
        }
        .links a {
          font-size: 0.78rem;
          padding: 7px 11px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 380px) {
        .key,
        .wide {
          flex: 1 1 100%;
        }
      }
      /* fix: flat 3D context so every key receives its own click */
      .kb-scene,
      .keyboard {
        transform-style: flat !important;
      }
      .stage {
        perspective: none;
      }
      .kb-scene {
        perspective: 1400px;
      }
    </style>
  </head>
  <body>
    <div class="tokens" aria-hidden="true">
      <span>{ }</span><span>&lt;/&gt;</span><span>=&gt;</span
      ><span>git push</span><span>01</span> <span>[ ]</span><span>npm i</span
      ><span>( )</span><span>&amp;&amp;</span><span>dev</span>

    <main class="wrap">
      <header class="intro">
        <p class="path">~/portfolio <span class="branch">(main)</span></p>
        <h1>Esha Ashfar</h1>
        <p class="role">
          Software Engineer<span class="dot">·</span>Full-Stack<span class="dot"

          >Bahrain

          <a id="lnk-github" target="_blank" rel="noreferrer">gh/ GitHub</a>

      <div class="stage">
        <div class="monitor">
          <div class="bar">
            <i class="r"></i><i class="y"></i><i class="g"></i
            ><span class="file" id="file">about.ts</span>

          <div class="screen">
            <p class="cmd">
              <span class="prompt">esha@dev:~$</span> <span id="cmd"></span

              <button class="key k-ink space" data-sec="contact">

        </div>
      </div>
      <footer>
        © <span id="yr"></span> Esha Ashfar · built with code &amp; coffee
      </footer>
    </main>

        var sections = {

              '<pre class="code"><span class="c-com">// hello world 👋</span>\n' +

          skills: {

                "HTML",

              ]) +
              '<p class="label">frameworks</p>' +
              chips([
                "Laravel",
                "Node.js",
                "Express",
                "React",
                "React Native",
                "FastAPI",
                "Ionic",
                "Oracle APEX",
              ]) +
              '<p class="label">databases</p>' +
              chips(["MySQL", "PostgreSQL", "MongoDB", "Supabase"]) +
              '<p class="label">tools</p>' +
              chips([
                "Git",
                "GitHub",
                "VS Code",
                "Maven",
                "JUnit",
                "Jest",
                "Supertest",
                "Vercel",
                "Render",
                "Blender",
              ]) +
              '<p class="label">concepts</p>' +
              chips([
                "MVC",
                "REST APIs",
                "Role-Based Access",
                "JWT Auth",
                "Unit & API Testing",
                "Zod",
              ]),
          },
          experience: {
            file: "experience.log",
            cmd: "git log --oneline",
            html:
              '<div class="timeline">' +
              '<div><p class="when">Jul – Oct 2026</p><h3>Software Engineering Bootcamp</h3><p class="org">General Assembly, Bahrain</p><p>Intensive full-stack program; built and deployed MEN, MERN and React + FastAPI projects.</p></div>' +
              '<div><p class="when">Jun – Aug 2024</p><h3>Full Stack Developer Intern</h3><p class="org">Sama Card, Bahrain</p><p>Built frontend and backend features for Sama Pet with Laravel and Ionic; designed MySQL databases.</p></div>' +
              '<div><p class="when">Part-time</p><h3>Tutor</h3><p class="org">Sabina Al Ansari Mosque & Al Eslah Society</p><p>Academic tutoring and learning guidance for students.</p></div>' +
              "</div>",
          },
          projects: {
            file: "projects/",
            cmd: "ls ./projects",
            html:
              '<div class="grid">' +
              projects
                .map(function (p) {
                  var title = p[4]
                    ? '<a href="' +
                      p[4] +
                      '" target="_blank" rel="noreferrer">' +
                      esc(p[0]) +
                      " ↗</a>"
                    : esc(p[0]);
                  return (
                    '<div class="card"><h3>' +
                    title +
                    '<span class="tag">' +
                    p[1] +
                    "</span></h3><p>" +
                    esc(p[2]) +
                    '</p><p class="stack">' +
                    p[3] +
                    "</p></div>"
                  );
                })
                .join("") +
              "</div>" +
              '<p class="label" style="margin-top:14px">also: Library System (Java) · Museum App · Airline Reservation · Clinic Management · Olympic Games 2024 (Oracle) · Assignment Management · Anonymous Feedback</p>',
          },
          education: {
            file: "education.md",
            cmd: "cat education.md",
            html:
              '<div class="timeline">' +
              '<div><p class="when">2026</p><h3>B.Sc. Software Engineering</h3><p class="org">College of IT, University of Bahrain</p></div>' +
              '<div><p class="when">Jul – Oct 2026</p><h3>Software Engineering Bootcamp</h3><p class="org">General Assembly, Bahrain</p></div></div>',
          },
          certs: {
            file: "certs.txt",
            cmd: "cat certs.txt",
            html: '<ul class="list"><li>Microsoft Certified: Power Platform Developer Associate (2024)</li><li>Accelerated Computing with CUDA C++ (NVIDIA)</li><li>Parallel Computing with MPI (Coursera)</li><li>Regular Expressions in SQL (Coursera)</li><li>SQL CASE Statements (Coursera)</li><li>Introduction to GitHub Actions (Coursera)</li><li>Azure DevOps Boards (Coursera)</li></ul>',
          },
          volunteer: {
            file: "volunteer.txt",
            cmd: "cat volunteer.txt",
            html: '<ul class="list"><li>Redesigning Team Member, Dream Big Bahrain</li><li>Event Volunteer, ISF Gymnasiade 2024</li><li>School-Level Volunteer, Iqra Private School</li></ul>',
          },
          contact: {
            file: "contact.sh",
            cmd: "./contact.sh",
            html:
              "<h2>Let's build something together.</h2><p>Open to software engineering roles and collaborations.</p>" +
              '<pre class="code"><span class="c-key">email</span>    → <a class="u" href="mailto:' +
              contact.email +
              '">' +
              contact.email +
              "</a>\n" +
              '<span class="c-key">linkedin</span> → <a class="u" target="_blank" rel="noreferrer" href="' +
              contact.linkedin +
              '">' +
              contact.linkedin.replace("https://www.", "") +
              "</a>\n" +
              '<span class="c-key">github</span>   → <a class="u" target="_blank" rel="noreferrer" href="' +
              contact.github +
              '">' +
              contact.github.replace("https://", "") +
              "</a></pre>",
          },
        };

        var keys = [].slice.call(document.querySelectorAll(".key[data-sec]"));
        var panel = document.getElementById("panel"),
          cmdEl = document.getElementById("cmd"),
          fileEl = document.getElementById("file");
        var typer;

        function showMonitor() {
          var m = document.querySelector(".monitor");
          var r = m.getBoundingClientRect();
          if (r.top < 0 || r.top > innerHeight * 0.4)
            m.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function open(sec) {
          var s = sections[sec];
          if (!s) return;
          keys.forEach(function (k) {
            k.classList.toggle(
              "on",
              k.dataset.sec === sec && !k.classList.contains("k-plain"),
            );
          });
          fileEl.textContent = s.file;
          clearInterval(typer);
          var i = 0;
          cmdEl.textContent = "";
          typer = setInterval(function () {
            cmdEl.textContent = s.cmd.slice(0, ++i);
            if (i >= s.cmd.length) clearInterval(typer);
          }, 28);
          panel.innerHTML = s.html;
          panel.style.animation = "none";
          void panel.offsetWidth;
          panel.style.animation = "";
        }

        keys.forEach(function (k) {
          k.addEventListener("click", function () {
            open(k.dataset.sec);
            showMonitor();
          });
        });
        document.getElementById("cv").addEventListener("click", function () {
          var n = Object.keys(sections);
          open(n[Math.floor(Math.random() * n.length)]);
          showMonitor();
        });

        / physical keyboard /;
        var map = {
          a: "about",
          s: "skills",
          e: "experience",
          p: "projects",
          d: "education",
          c: "certs",
          v: "volunteer",
          enter: "contact",
          escape: "about",
          " ": "contact",
        };
        addEventListener("keydown", function (e) {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          var sec = map[e.key.toLowerCase()];
          if (!sec) return;
          if (e.key === " ") e.preventDefault();
          var btn = keys.filter(function (k) {
            return k.dataset.sec === sec;
          })[0];
          if (btn) {
            btn.classList.add("down");
            setTimeout(function () {
              btn.classList.remove("down");
            }, 120);
          }
          open(sec);
        });

        / 3D tilt follows the mouse /;
        var kb = document.getElementById("keyboard");
        if (matchMedia("(pointer: fine)").matches) {
          addEventListener("mousemove", function (e) {
            var x = e.clientX / innerWidth - 0.5,
              y = e.clientY / innerHeight - 0.5;
            kb.style.setProperty("--ry", (x * 14).toFixed(2) + "deg");
            kb.style.setProperty("--rx", (40 + y * 12).toFixed(2) + "deg");
          });
        }
        open("about");
      })();
    </script>
  </body>
</html>
